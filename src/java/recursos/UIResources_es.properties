welcome.description= Esta aplicaci\u00f3n permite al usuario inscribirse a un plan de entrenamiento atl\u00e9tico por medio de la red. Este sitio sirve como un servicio de entrenamiento atl\u00e9tico por el cual el usuario simplemente selecciona un evento para entrenar, y el servicio proporcionara el entrenamiento por la l\u00ednea.	 
welcome.listitem1= Un detallado horario de entrenamiento por la red para un evento al cual el usuario puede entrar su informaci\u00f3n de entrenamiento propia.
welcome.listitem2=Consejo por un entrenador atl\u00e9tico <b>verdadero</b> quien vigilara el progreso del atleta y dar\u00e1 consejos expertos y ayuda t\u00e9cnica durante la duraci\u00f3n de todo el entrenamiento. 
welcome.listitem3=M\u00faltiple eventos de diferentes tipos sirviendo a diferentes edades y diferentes niveles de entrenamiento.
welcome.signup=!Reg\u00edstrese hoy!

