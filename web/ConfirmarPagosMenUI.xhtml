<?xml version="1.0" encoding="ISO-8859-1"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core" 
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui" >

    <f:view> 
        <h:head>
            <link href="../css/CalendarControl.css" rel="stylesheet" type="text/css"></link>
            <script src="CalendarControl.js" language="javascript"></script>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>
        <body>
            <h:form  >
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="Software Express"/>
                                    </i></font></td>
                        </td>

                        <td align="right" width="25%">
                            <i>
                                <h:commandLink action="#{ConfirmarPagosMenUI_Backing.salir}" immediate="true">
                                    <h:outputText value="Salir"/>
                                </h:commandLink>

                            </i>
                        </td>
                    </tr>
                </table>
                <br></br>
                <h:messages globalOnly="true" infoClass="RegError"/>    
                <div align="center"><h4><i>Confirmar pagos mensuales del servicio</i></h4></div>

                <div align="center">
                    <p>
                        <h:commandButton value="Confirmar pago" action="#{ConfirmarPagosMenUI_Backing.confirmarPagosMensuales}" tabindex="11"/>  
                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>
                        <h:commandButton value="Revertir confirmación" action="#{ConfirmarPagosMenUI_Backing.revertirPagoMensual}" tabindex="12"/> 
                    </p>
                </div>             
                <h4><i>Pagos de mensualidades registrados.</i><font size="2"><i> Seleccione el o los pagos a procesar</i></font></h4>

                <p:dataTable id="TablaPagosMensuales" rows="8" rowKey="#{co.id}" 
                             value="#{ConfirmarPagosMenUI_Backing.pagosMensualesPorSuscripcion}" paginatorPosition="bottom"
                             var="co" paginator="true" 
                             selection="#{ConfirmarPagosMenUI_Backing.pagosSeleccionados}">    

                    <p:column selectionMode="multiple" style="width:18px" />  

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecPagoMensual}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="# Susc."/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.numSuscriptor}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Nombre"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombSuscriptor}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Apellido"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.apelSuscriptor}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Referencia"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.refPagoMensual}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Banco"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.bcoPagoMensual}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Cuenta"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.ctaPagoMensual}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Monto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.mtoPagoMensual}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha mov"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecMovPagoMensual}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Estado"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.edoPagoMensual}"/>
                    </p:column>

                </p:dataTable>

            </h:form>
        </body>
    </f:view> 
</html>
