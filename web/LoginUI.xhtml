<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core">

    <f:view> 
        <h:head>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>

        <body><h:form>

                <table width="100%" border="0" >
                    <tr>
                        <tr>
                            <div align="center"><h1>
                                   <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                                </h1></div>
                        </tr>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="right">
                            <h:commandLink action="bienvenida" immediate="true">
                                <h:outputText value="Salir"/>
                            </h:commandLink>
                            <f:verbatim>&nbsp;&nbsp;|&nbsp;&nbsp;</f:verbatim>
                            <h:commandLink immediate="true"  onclick="Ayuda('ALoginUI.xhtml')">
                                <h:outputText value="Ayuda"/>
                            </h:commandLink>
                        </td>
                    </tr>
                </table>

                <div align="center"><h4>Entrada al Sistema</h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>   

                <hr size="1" width="50%"></hr>
                <br></br>

                <table width="50%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="4" border="0">

                                <h:outputLabel value="Codigo de usuario " for="codUsuario" />                
                                <h:inputText id="codUsuario" 
                                             binding="#{Login_Backing.codUsuario}" tabindex="1"/>

                                <h:outputLabel value="Contraseña" for="contUsuario"/>                
                                <h:inputSecret id="contUsuario" 
                                               binding="#{Login_Backing.contUsuario}" tabindex="2"/> 
                            </h:panelGrid>
                        </td>
                    </tr>
                </table>
                <br></br>
                <hr size="1" width="50%"></hr>

                <div  align="center"><p><h:commandButton value="Ingresar" action="#{Login_Backing.login}" tabindex="3"/>
                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>
                        <h:commandButton value="Cancelar" action="bienvenida"
                                         immediate="true" tabindex="4"/></p></div>
            </h:form>
        </body>
    </f:view> 
</html>
