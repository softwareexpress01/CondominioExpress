<?xml version='1.0' encoding='ISO-8859-1' ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core" 
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui" >

    <f:view> 
        <h:head>

            <link href="../css/CalendarControl.css" rel="stylesheet" type="text/css"></link>
            <!--       <link href="../css/primeFaces.css" rel="stylesheet" type="text/css"></link> -->
            <script src="../css/CalendarControl.js" language="javascript"></script>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"/>
            </f:facet>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>
        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%"><i>
                                <h:commandLink onclick="Ayuda('APagoFonResUI.xhtml')">
                                    <h:outputText value="Ayuda"/>
                                </h:commandLink></i>
                        </td>
                    </tr>
                </table>

                <div><h4><i>Procesar pagos de Fondos </i></h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>    
                <hr size="2" width="85%"></hr>
                <table width="85%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="6" border="0">

                                <h:outputLabel value="Descripción " for="desPagoFonRes"/>                
                                <h:inputText required="false" id="desPagoFonRes" size="24" maxlength="60"
                                             value="#{PagoFonResUI_Backing.desPagoFonRes}" tabindex="1" />

                                <h:outputLabel value="Nro. Doc/Ref " for="numDocPagoFonRes"/>                
                                <h:inputText required="false" id="numDocPagoFonRes" size="24" maxlength="20"
                                             value="#{PagoFonResUI_Backing.numDocPagoFonRes}" tabindex="2" />

                                <h:outputLabel value="Monto " for="mtoPagoFonRes"/>                
                                <h:inputText required="false" id="mtoPagoFonRes" size="15" maxlength="16"
                                             value="#{PagoFonResUI_Backing.mtoPagoFonRes}" tabindex="3" />

                                <h:outputLabel value="Forma de pago " for="formaPagoFonRes"/>  
                                <h:selectOneMenu id="formaPagoFonRes" value="#{PagoFonResUI_Backing.formaPagoFonRes}" tabindex="4" >
                                    <f:selectItem  itemLabel="Cheque" itemValue="Cheque" />
                                    <f:selectItem  itemLabel="Transferencia" itemValue="Transferencia" />
                                    <f:selectItem  itemLabel="Deposito" itemValue="Deposito" />
                                    <f:selectItem  itemLabel="Efectivo" itemValue="Efectivo" />
                                </h:selectOneMenu>

                                <h:outputLabel value="Fecha del doc. (dd-mm-aaaa) " for="fecDocPagoFonRes"/>                                                                                               
                                <h:inputText required="false" id="fecDocPagoFonRes" size="24" maxlength="10"
                                             value="#{PagoFonResUI_Backing.fecDocPagoFonRes}" tabindex="5"
                                             onfocus="showCalendarControl(this);"/>

                            </h:panelGrid>
                        </td> 
                    </tr>
                </table>
                <br></br>

                <hr size="2" width="85%"></hr>

                <table width="40%"  border="0" align="center">
                    <tr>
                        <td>
                            <h:outputLabel value="Bancos" for="idBcoPagoFonRes" />                             
                            <h:selectOneMenu value="#{PagoFonResUI_Backing.idBcoPagoFonRes}" id="idBancoFonRes" tabindex="6"
                                             onchange="this.form.submit()">
                                <f:selectItems value="#{PagoFonResUI_Backing.bancosPorCondominio}"/>
                            </h:selectOneMenu>
                        </td>
                        <td>

                            <h:outputLabel value="Cuentas " for="idCuentapagoFonRes" />                             
                            <h:selectOneMenu value="#{PagoFonResUI_Backing.idCuentaPagoFonRes}" id="idCuentaPagoFonRes" tabindex="7">
                                <f:selectItems value="#{PagoFonResUI_Backing.cuentasPorBanco}"/>
                            </h:selectOneMenu>
                        </td>
                    </tr>
                </table> 

                <hr size="2" width="85%"></hr>
                <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>
                <div align="center">
                    <p>
                        <h:commandButton value="Procesar pago" action="#{PagoFonResUI_Backing.registrarPagoFonRes}" tabindex="8"/>  
                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>
                        <h:commandButton value="Revertir pago" action="revertirpagofonres"/>

                    </p>
                </div>

                <hr width="100%"></hr>
                <h4><i>Cuentas por Pagar al Fondo de Reserva registradas.</i><font size="2"><i> Seleccione la(s) cuenta(s) a procesar</i></font></h4>

                <p:dataTable id="TablaPagosFonRes" rows="8" rowKey="#{co.id}"  emptyMessage=" " 
                             value="#{PagoFonResUI_Backing.fondosDeReservaPorPagar}" paginatorPosition="bottom"
                             var="co" paginator="true" 
                             selection="#{PagoFonResUI_Backing.facSeleccionadas}">    

                    <p:column selectionMode="multiple" style="width:18px" />  

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecEmiPagoFonRes}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Descripcion"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.desPagoFonRes}"/>
                    </p:column>

                    <p:column style="text-align:right">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Monto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.mtoPagoFonRes}"/>
                    </p:column>

                    <p:column style="text-align:right">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Saldo"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.saldoPagoFonRes}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha Mov."/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecMovPagoFonRes}"/>
                    </p:column>

                </p:dataTable>

            </h:form>
        </body>
    </f:view> 
</html>
