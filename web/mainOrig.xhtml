                        <p:graphicImage id="tab1Img" value="/images/vtlogo.jpg" />  
                        <h:outputText id="tab1Text"  
                                      value="The story begins as Don Vito Corleone, the head of a New York Mafia family, oversees his daughter's wedding.  
                                      His beloved son Michael has just come home from the war, but does not intend to become part of his father's business. T  
                                      hrough Michael's life the nature of the family business becomes clear. The business of the family is just like the head of the family, kind and benevolent to those who give respect,  
                                      but given to ruthless violence whenever anything stands against the good of the family." />          </h:panelGrid>  
                </p:tab>  

                <p:tab id="tab2" title="Computación en la nube">  
                    <h:panelGrid columns="1" cellpadding="10">  
                        <p:graphicImage id="tab2Img"  value="/images/Cloud.png" />  
                        <h:outputText id="tab2Text" value="Es un nuevo modelo de prestación de servicios de negocio y tecnología, 
                                      que permite incluso al usuario acceder a un catálogo de servicios estandarizados y responder con ellos 
                                      a las necesidades de su negocio, de forma flexible y adaptativa, en caso de demandas no previsibles o 
                                      de picos de trabajo, pagando únicamente por el consumo efectuado, o incluso gratuitamente en caso de 
                                      proveedores que se financian mediante publicidad o de organizaciones sin ánimo de lucro."/>

                        <h:outputText id="tab21Text" value="              
                                      El cambio que ofrece la computación desde la nube es que permite aumentar el número de servicios basados en la red.
                                      Esto genera beneficios tanto para los proveedores, que pueden ofrecer, de forma más rápida y eficiente, un mayor 
                                      número de servicios, como para los usuarios que tienen la posibilidad de acceder a ellos, disfrutando de la 
                                      transparencia e inmediatez del sistema y de un modelo de pago por consumo. Así mismo, el consumidor ahorra los
                                      costes salariales o los costes en inversión económica (locales, material especializado, etc)."/>
                        <h:outputText id="tab22Text" value="        
                                      Computación en nube consigue aportar estas ventajas, apoyándose sobre una infraestructura tecnológica dinámica 
                                      que se caracteriza, entre otros factores, por un alto grado de automatización, una rápida movilización de los 
                                      recursos, una elevada capacidad de adaptación para atender a una demanda variable, así como virtualización avanzada y un precio flexible en función del consumo realizado, evitando además el uso fraudulento del software y la piratería.
                                      La computación en nube es un concepto que incorpora el software como servicio, como en la Web 2.0 y otros conceptos 
                                      recientes, también conocidos como tendencias tecnológicas, que tienen en común el que confían en Internet para 
                                      satisfacer las necesidades de cómputo de los usuarios."/>  
                    </h:panelGrid>  
                </p:tab>
