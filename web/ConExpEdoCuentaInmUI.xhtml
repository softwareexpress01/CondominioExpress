<?xml version="1.0" encoding="ISO-8859-1"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core">

    <f:view> 
        <h:head>
            <link href="../css/CalendarControl.css" rel="stylesheet" type="text/css"></link>
            <script src="CalendarControl.js" language="javascript"></script>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>
        </h:head>
        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="400" />
                            </h1></div>
                    </tr>          
                </table>   
                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/></i></font>
                            </td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i>Condominio:<f:verbatim>&nbsp;</f:verbatim><h:outputLabel  value="#{BeanUsuario.condominioActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%">
                            <i><h:commandLink action="#{ConExpEdoCuentaInmUI_Backing.salir}" immediate="true"> <h:outputText value="Salir"/></h:commandLink></i>
                        </td>
                    </tr>
                </table>
                
                <br></br>
                <div align="center">
                    <h:outputText value="Consulta Express" style="  font-weight:500; font-family: arial;font-size: x-large; color: green; font-style: italic"></h:outputText>
                </div>

                <div align="center" ><h4>Procesar estados de cuenta por inmueble</h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>   

                <hr size="1" width="80%"></hr>
                <br></br>

                <table width="80%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="6" border="0">

                                <h:outputLabel value="Fecha desde (dd-mm-aaaa) " for="fecEdoCuentaInm"/>  

                                <h:inputText required="false" id="fecDesde" size="12" 
                                             value="#{ConExpEdoCuentaInmUI_Backing.fecDesde}" tabindex="4"
                                             onfocus="showCalendarControl(this);"/>

                                <h:outputLabel value="Fecha hasta (dd-mm-aaaa) " for="fecHasta"/>  

                                <h:inputText required="false" id="fecHasta" size="12" 
                                             value="#{ConExpEdoCuentaInmUI_Backing.fecHasta}" tabindex="5"
                                             onfocus="showCalendarControl(this);"/>

                            </h:panelGrid>   
                        </td>  
                    </tr>  
                </table>
                <br></br>
                <hr size="1" width="80%"></hr>
                <br></br>
                <div align="center">
                    <p>
                        <h:commandButton value="Generar estado de cuenta" actionListener="#{ConExpEdoCuentaInmUI_Backing.generarEdoCuentaInmueble}"
                                         disabled ="#{BeanUsuario.agregar}" tabindex="6"/>  

                    </p>
                </div>  
            </h:form>
        </body>
    </f:view> 
</html>
