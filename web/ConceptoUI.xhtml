<?xml version="1.0" encoding="ISO-8859-1"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core" 
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui"> 

    <f:view> 
        <h:head>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>
        <h:body>

            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%"><i>
                                <h:commandLink immediate="true" onclick="Ayuda('AConceptoUI.xhtml')">
                                    <h:outputText value="Ayuda"/>
                                </h:commandLink></i>
                        </td>
                    </tr>
                </table>

                <div><h4><i>Crear y Actualizar Conceptos</i></h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>    
                <br></br>
                <table width="80%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="6" border="0">

                                <h:outputLabel value="Nombre del concepto " for="nombConcepto"/>                
                                <h:inputText required="false" id="nombConcepto" size="24" maxlength="30"
                                             value="#{ConceptoUI_Backing.nombConcepto}" tabindex="1" />

                                <h:outputLabel value="Descripción" for="descConcepto" />              
                                <h:inputText required="false" id="descConcepto" maxlength="60" size="24"
                                             value="#{ConceptoUI_Backing.descConcepto}" tabindex="2"/>

                                <h:outputLabel value="Categorías" for="catConcepto" />                             
                                <h:selectOneMenu binding="#{ConceptoUI_Backing.categoria}" id="catConcepto" tabindex="3" >
                                    <f:selectItems value="#{ConceptoUI_Backing.categoriasPorCondominio}"/>
                                </h:selectOneMenu> 
                            </h:panelGrid>
                        </td>  
                    </tr>  
                </table>
                <br></br>
                <div align="center"><p>
                        <h:commandButton value="Agregar" action="#{ConceptoUI_Backing.registrarConcepto}" 
                                         disabled ="#{BeanUsuario.agregar}" tabindex="4"/>  

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Modificar" action="#{ConceptoUI_Backing.modificarConcepto}"
                                         disabled ="#{BeanUsuario.modificar}" tabindex="5"/>   

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Eliminar" action="eliminar"
                                         disabled ="#{BeanUsuario.eliminar}"  tabindex="6"/>   
                    </p></div>

                <hr width="100%"></hr>
                <h4><i>Conceptos registrados.</i><font size="2"><i> Seleccione el concepto a modificar/eliminar</i></font></h4>

                <p:dataTable id="TablaConceptos" rows="5" rowKey="#{co.id}"     
                             value="#{ConceptoUI_Backing.conceptosPorCondominio}" paginatorPosition="bottom"
                             var="co" paginator="true"    
                             selection="#{ConceptoUI_Backing.filaSeleccionada}" selectionMode="single">          

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Nombre"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombConcepto}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Descripción"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.descConcepto}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Categoría"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombCategoria}"/>
                    </p:column>

                    <p:column>
                        <h:commandLink action="#{ConceptoUI_Backing.editarConceptoAction}">
                            <h:outputText value="Seleccionar" />
                            <f:setPropertyActionListener value="#{co}" target="#{ConceptoUI_Backing.filaSeleccionada}" ></f:setPropertyActionListener>
                        </h:commandLink>
                    </p:column>

                </p:dataTable>

            </h:form>
        </h:body>
    </f:view> 
</html>
