<?xml version='1.0' encoding='ISO-8859-1' ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core" 
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui" >

    <f:view> 
        <h:head>

            <link href="../css/CalendarControl.css" rel="stylesheet" type="text/css"></link>
            <!--       <link href="../css/primeFaces.css" rel="stylesheet" type="text/css"></link> -->
            <script src="../css/CalendarControl.js" language="javascript"></script>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"/>
            </f:facet>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>
        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="Software Express"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>

                        <td align="right" width="25%">

                            <f:verbatim>&nbsp;&nbsp;|&nbsp;&nbsp;</f:verbatim>
                            <h:commandLink action="#{ConSusUI_Backing.salir}" immediate="true">
                                <h:outputText value="Salir"/>
                            </h:commandLink>
                            <f:verbatim>&nbsp;&nbsp;|&nbsp;&nbsp;</f:verbatim>

                        </td>
                    </tr>
                </table>
                <h:messages globalOnly="true" infoClass="RegError"/>
                <br></br>
                <div align="center"><h4>Consulta de Suscripciones </h4></div>

                <hr size="1" width="45%"></hr>



                <table width="30%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="4" border="0">

                                <h:outputLabel value="Cédula o RIF del Suscriptor " for="numCedSuscriptor" />     
                                <h:inputText required="false" id="numCedSuscriptor" size="24" maxlength ="10"
                                             value="#{ConSusUI_Backing.numCedSuscriptor}" tabindex="1" /> 

                            </h:panelGrid>
                        </td>
                    </tr>
                </table>

                <div align="center">
                    <p>
                        <h:commandButton value="Consultar" action="#{ConSusUI_Backing.consultarSuscripcion}" tabindex="2"/>  
                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                    </p>
                </div>

                <hr size="1" width="45%"></hr>
                <br></br>

                <hr width="100%"></hr>
                <h4><i>Suscripciones registradas.</i><font size="2"></font></h4>


                <p:dataTable id="TablaSuscripciones" rows="12" rowKey="#{co.id}"  emptyMessage=" " 
                             value="#{ConSusUI_Backing.suscripcionesRegistradas}" paginatorPosition="bottom"
                             var="co" paginator="true" 
                             selection="#{ConfSolUI_Backing.solSeleccionadas}">    

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Número"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.numSuscripcion}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Contraseña"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.contSuscripcion}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Nombre"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombSuscriptor}"/>
                    </p:column>

                    <p:column >
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Apellido"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.apelSuscriptor}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Email"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.emailSuscriptor}"/>
                    </p:column>
                    <p:column width="120">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Tel.Local"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.telSuscriptor}"/>
                    </p:column>

                    <p:column width="120">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Celular"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.celSuscriptor}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Edo.Sol"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.edoSolSuscripcion}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Edo.Sus"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.edoSuscripcion}"/>
                    </p:column>
                    <p:column width="120">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fec.Sus"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecSuscripcionString}"/> 
                    </p:column>
                    <p:column style="text-align:right">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Saldo.Sus"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.saldoSuscripcionString}"/> 
                    </p:column>
                    <p:column style="text-align:center">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Día Corte"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.diaCorteSuscripcion}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Plan"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.planSuscripcion}"/>
                    </p:column>
                    <p:column width="120">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Admin"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombAdmin}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Cod.Admin"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.codAdmin}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Cont.Admin"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.contAdmin}"/>
                    </p:column>
                </p:dataTable>

            </h:form>
        </body>
    </f:view> 
</html>
