<?xml version='1.0' encoding="ISO-8859-1" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core"
      > 

    <f:view> 
        <h:head>
            <title>Software Express Condominio</title>
            <link href="../css/CalendarControl.css" rel="stylesheet" type="text/css"></link>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>

        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table> 
                <table width="100%" border="0" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%">
                            <f:verbatim>&nbsp;&nbsp;</f:verbatim>
                        </td>
                    </tr>
                </table>



                <br></br> <br></br> <br></br>
                <div align="center" ><h4>Enviar correspondencia a los propietarios</h4></div> 

                <h:messages globalOnly="true" infoClass="RegError"/>   

                <hr size="1" width="25%"></hr>
                <br></br>

                <table width="70%" border="0" align="center">
                    <tr align="center">
                        <td align="center">

                            <h:outputLabel value="Inmuebles " for="idInmueble2"/>   
                            <h:selectOneMenu value="#{CorrespondenciaUI_Backing.idInmueble}" id="idInmueble2" tabindex="1" 
                                             onchange="this.form.submit()">
                                <f:selectItems value="#{CorrespondenciaUI_Backing.inmueblesPorCondominio}"/>
                            </h:selectOneMenu>
                        </td>
                    </tr>  
                </table>
                <br></br>
                <hr size="1" width="25%"></hr>
                <br></br>

                <div align="center">
                    <h:commandButton value="Aceptar" action="#{CorrespondenciaUI_Backing.enviarCorrespondencia}" tabindex="7"/> 
                </div>  
            </h:form>
        </body>
    </f:view> 
</html>
