<?xml version="1.0" encoding="ISO-8859-1"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd" >
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:t="http://myfaces.apache.org/tomahawk">

    <f:view> 
        <h:head>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <script type="text/javascript">
                function limita(maximoCaracteres) {
                    var elemento = document.getElementById("obsAvisoCobro");
                    if(elemento.value.length >= maximoCaracteres ) {
                        return false;
                    }
                    else {
                        return true;
                    }
                }
            </script>
            <script type="text/javascript">
            function limitaObs(maximoCaracteres) {
                var elemento = document.getElementById("obsAvisoCobro2");
                if(elemento.value.length >= maximoCaracteres ) {
                    return false;
                }
                else {
                    return true;
                }
            }
            </script>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>

        <body><h:form>
                <table width="100%" border="0">
                    <tr>
                        <tr>
                            <div align="center"><h1>
                                    <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                                </h1></div>
                        </tr>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i><h:outputLabel  value="Nro de suscripción:"/>,<h:outputLabel value="#{SuscripcionDT.numSuscripcion}"/></i></font></td>
                        </td>
                        <td align="right" width="25%">
                                <h:commandLink action="#{ModificarSuscripcionUI_Backing.salir}" immediate="true">
                                    <i><h:outputText value="Salir"/></i>
                                </h:commandLink> 
                        </td>
                    </tr>
                </table>
                <h:messages globalOnly="true" infoClass="RegError"/> 
                <div align="center"><h4>Modificar datos de suscripciones</h4></div>

                <hr size="1" width="80%" align="center"></hr>
                <table width="80%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid  columns="2" border="0" >

                                <h:outputLabel value="Nombre " for="nombSuscriptor" />                
                                <h:inputText id="nombSuscriptor"  value="#{SuscripcionDT.nombSuscriptor}" tabindex="3" maxlength="20" size="30"/>

                                <h:outputLabel value="Correo electrónico" for="emailSuscriptor" />              
                                <h:inputText id="emailSuscriptor"  value="#{SuscripcionDT.emailSuscriptor}" tabindex="4" maxlength="30" size="30"/>

                                <h:outputLabel value="Estado suscripción" for="edoSuscripcion" />              
                                <h:inputText id="edoSuscripcion"  value="#{SuscripcionDT.edoSuscripcion}" size="6" tabindex="4" maxlength="3"/>

                            </h:panelGrid>
                        </td>  

                        <td>
                            <h:panelGrid columns="2" border="0">

                                <h:outputLabel value="Apellido" for="apelSuscriptor" />                
                                <h:inputText id="apelSuscriptor" value="#{SuscripcionDT.apelSuscriptor}" tabindex="5" maxlength="20" />

                                <h:outputLabel value="Teléfono" for="telSuscriptor" /> 
                                <h:inputText id="telSuscriptor" value="#{SuscripcionDT.telSuscriptor}" tabindex="6" maxlength="11"/>

                                <h:outputLabel value="Dia de corte" for="diaCorteSuscripcion" /> 
                                <h:inputText id="diaCorteSuscripcion" value="#{SuscripcionDT.diaCorteSuscripcion}" tabindex="6" maxlength="2" size="6"/>


                            </h:panelGrid>
                        </td> 
                        <td>
                            <h:panelGrid columns="2" border="0">

                                <h:outputLabel value="Cedula / Rif " for="cedSuscriptor" />              
                                <h:inputText id="cedSuscriptor"  value="#{SuscripcionDT.numCedSuscriptor}" tabindex="7" maxlength="10"/>

                                <h:outputLabel value="Celular " for="celSuscriptor" />              
                                <h:inputText id="celSuscriptor" value="#{SuscripcionDT.celSuscriptor}" tabindex="8" maxlength="11"/>

                                <h:outputLabel value="Plan" for="planSuscripcion" />                             
                                <h:selectOneMenu binding="#{SuscripcionDT.idPlan}" id="planSuscripcion" tabindex="3" >
                                    <f:selectItems value="#{ModificarSuscripcionUI_Backing.planes}"/>
                                </h:selectOneMenu> 
                            </h:panelGrid>
                        </td>     
                    </tr>  
                </table>

                <hr size="2" width="80%"></hr>

                <div align ="center" ><p>
                        <h:commandButton value="Actualizar"
                                         action="#{ModificarSuscripcionUI_Backing.modificarSuscripcion}" tabindex="13"/>
                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>
                    </p></div>

            </h:form>
        </body>
    </f:view> 
</html>
