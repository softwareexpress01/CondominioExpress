<?xml version="1.0" encoding="ISO-8859-1"?> 

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">  

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"      
      xmlns:p="http://primefaces.org/ui">  

    <h:head>
        <title>Software Express Condominio</title>
        <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
        <script language="javascript">
            function Ayuda(tema)
            {
                var AWin;
                AWin = window.open(tema, "helpwin", "left=750,height=450,width=600, resizable=yes");
                AWin.focus();
            }
        </script>
        <f:facet name="first"> 
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
        </f:facet>
        <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
    </h:head>
    <h:body>  

        <h:form enctype="multipart/form-data">

            <table width="100%" border="0" >
                <tr>
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>
                </tr>          
            </table>      

            <table width="100%" class="BarBkgnd">
                <tr>
                    <td align="left">
                        <td>
                            <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                </i></font></td>
                    </td>
                    <td></td><td></td><td></td>
                    <td align="center" width="10%" >
                        <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                    </td>
                    <td align="right" width="25%"><i>
                            <h:commandLink immediate="true"  onclick="Ayuda('ALogoUI.xhtml')">
                                <h:outputText value="Ayuda"/>
                            </h:commandLink></i>
                    </td>
                </tr>
            </table>

            <h:messages globalOnly="true" infoClass="RegError"/>   
            <div align="center"><h4><i>Registrar y actualizar logo</i></h4></div>

            <div align="center">
                <hr size="1" width="35%"></hr>
                <br></br>
                <table width="10%" border="0" align="center">
                    <p:fileUpload value="#{LogoUI_Backing.file}" mode="simple"/>
                    <h:commandButton value="Registrar" action="#{LogoUI_Backing.upLoad}"/>

                </table>
                <br></br>
                <hr size="1" width="35%"></hr>
                <br></br>

            </div>
        </h:form>  

    </h:body>  

</html>
