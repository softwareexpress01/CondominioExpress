<?xml version="1.0" encoding="ISO-8859-1"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core" 
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui">

    <f:view> 
        <h:head>
            <title>Software Express Condominio</title>
            <link href="../css/CalendarControl.css" rel="stylesheet" type="text/css"></link>
            <script src="../CalendarControl.js" language="javascript"></script>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />

            </f:facet>

            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>
        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>

                        <td align="right" width="25%"><i>
                                <f:verbatim>&nbsp;&nbsp;|&nbsp;</f:verbatim>
                                <h:commandLink action="#{RevertirConfSusUI_Backing.salir}" immediate="true">
                                    <h:outputText value="Salir"/>
                                </h:commandLink>

                                <f:verbatim>&nbsp;&nbsp;|&nbsp;&nbsp;</f:verbatim>
                            </i>
                        </td>
                    </tr>
                </table>

                <div><h4><i>Revertir confirmación de Suscripción</i></h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>    

                <div align="center"><h4>Datos básicos Suscripción</h4></div>
                <table width="70%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="2" border="0">

                                <h:outputLabel value="Céd/RIF" for="numCedSuscriptor" /> 
                                <h:inputText required="false" id="numCedSuscriptor" size="24" maxlength ="10"
                                             value="#{RevertirConfSusUI_Backing.numCedSuscriptor}" tabindex="1"/> 

                                <h:outputLabel value="Correo " for="emailSuscriptor"/>                
                                <h:inputText id="emailSuscriptor" size="24" required="false" maxlength ="30"
                                             value="#{RevertirConfSusUI_Backing.emailSuscriptor}" tabindex="4"/>

                                <h:outputLabel value="Fecha " for="fecSuscripcion"/>                                                                                               
                                <h:inputText required="false" id="fecSuscripcion" size="24" 
                                             value="#{RevertirConfSusUI_Backing.fecSuscripcion}" tabindex="7"/>

                            </h:panelGrid>
                        </td>  

                        <td>
                            <h:panelGrid width="100%" columns="2" border="0">

                                <h:outputLabel value="Nombre" for="nombSuscriptor" /> 
                                <h:inputText required="false" id="nombSuscriptor" size="24" maxlength ="30"
                                             value="#{RevertirConfSusUI_Backing.nombSuscriptor}" tabindex="2"/> 

                                <h:outputLabel value="Teléfono Fijo " for="telSuscriptor"/> 
                                <h:inputText required="false" id="telSuscriptor" size="24" maxlength ="10"
                                             value="#{RevertirConfSusUI_Backing.telSuscriptor}" tabindex="5"/>

                                <h:outputLabel value="Número " for="numSuscripcion"/> 
                                <h:inputText required="false" id="numSuscripcion" size="24" maxlength ="10"
                                             value="#{RevertirConfSusUI_Backing.numSuscripcion}" tabindex="8"/>

                            </h:panelGrid>
                        </td>

                        <td>
                            <h:panelGrid width="100%" columns="2" border="0">

                                <h:outputLabel value="Apellido" for="apelSuscriptor" /> 
                                <h:inputText required="false" id="apelSuscriptor" size="24" maxlength ="10"
                                             value="#{RevertirConfSusUI_Backing.apelSuscriptor}" tabindex="3"/> 

                                <h:outputLabel value="Celular " for="celSuscriptor"/>  
                                <h:inputText required="false" id="celSuscriptor" size="24" maxlength ="10"
                                             value="#{RevertirConfSusUI_Backing.celSuscriptor}" tabindex="6"/>

                                <h:outputLabel value="Estado " for="edoSuscripcion"/>  
                                <h:inputText required="false" id="edoSuscripcion" size="24" maxlength ="10"
                                             value="#{RevertirConfSusUI_Backing.edoSuscripcion}" tabindex="9"/>

                            </h:panelGrid>
                        </td>

                    </tr>  

                </table>

                <br></br>
                <div align="center">
                    <p>
                        <h:commandButton value="Revertir" action="revertir" disabled="#{BeanUsuario.revertir}" tabindex="10"/>  
                    </p>
                </div>

                <hr width="100%"></hr>
                <h4><i>Suscripciones confirmadas</i><font size="2"><i> Seleccione la que requiera procesar</i></font></h4>

                <p:dataTable id="TablaSuscripcionesConf" rows="5" rowKey="#{co.id}"   

                             value="#{RevertirConfSusUI_Backing.suscripcionesConfirmadas}" paginatorPosition="bottom"
                             var="co" paginator="true"   emptyMessage="  " 
                             selection="#{RevertirConfSusUI_Backing.filaSeleccionada}" >  

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Cédula/RIF"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.numCedSuscriptor}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Nombre"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombSuscriptor}"/>
                    </p:column>

                    <p:column >
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Apellido"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.apelSuscriptor}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Email"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.emailSuscriptor}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Teléfono Fijo"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.telSuscriptor}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Celular"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.celSuscriptor}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecSuscripcionString}"/>
                    </p:column>
                    <p:column style="text-align:right">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Número Susc."/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.numSuscripcion}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Estado"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.edoSuscripcion}"/>
                    </p:column>
                    <p:column>
                        <h:commandLink action="#{RevertirConfSusUI_Backing.editarSuscripcionAction}">
                            <h:outputText value="Seleccionar" />
                            <f:setPropertyActionListener value="#{co}" target="#{RevertirConfSusUI_Backing.filaSeleccionada}" ></f:setPropertyActionListener>
                        </h:commandLink>
                    </p:column>

                </p:dataTable>

            </h:form>
        </body>
    </f:view> 
</html>
