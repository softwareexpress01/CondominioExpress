<?xml version="1.0" encoding="ISO-8859-1"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core" xmlns:t="http://myfaces.apache.org/tomahawk">

    <f:view> 
        <h:head>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>
        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%"><i>
                                <h:commandLink action="#{GastoPropiedadUI_Backing.irASeleccionarCondominio}" immediate="true">
                                    <h:outputText value="Ir a Seleccionar Condominio"/>
                                </h:commandLink>
                                <f:verbatim>&nbsp;&nbsp;|&nbsp;&nbsp;</f:verbatim>
                                <h:commandLink action="#{GastoComunOrdUI_Backing.salir}" immediate="true">
                                    <h:outputText value="Salir"/>
                                </h:commandLink>
                                <f:verbatim>&nbsp;&nbsp;|&nbsp;&nbsp;</f:verbatim>
                                <h:commandLink immediate="true">
                                    <h:outputText value="Ayuda"/>
                                </h:commandLink></i>
                        </td>
                    </tr>
                </table>

                <div><h4><i>Procesar gastos por propiedad</i></h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>    

                <table width="70%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="6" border="0">

                                <h:outputLabel value="Proveedor " for="idProveedor"/>   
                                <h:selectOneMenu binding="#{GastoPropiedadUI_Backing.idProveedor}" id="idProveedor" tabindex="3" >
                                    <f:selectItems value="#{GastoPropiedadUI_Backing.proveedoresPorCondominio}"/>
                                </h:selectOneMenu>

                                <h:outputLabel value="Documento Nro. " for="numDocGastoPropiedad"/>                
                                <h:inputText required="false" id="numDocGastoPropiedad" size="24" 
                                             value="#{GastoPropiedadUI_Backing.numDocGastoPropiedad}" tabindex="4" />

                                <h:outputLabel value="Fecha doc (dd-mm-aa) " for="fecGastoPropiedad"/>                
                                <h:inputText required="false" id="fecGastoPropiedad" size="24" 
                                             value="#{GastoPropiedadUI_Backing.fecGastoPropiedad}" tabindex="5" /> 


                                <h:outputLabel value="Conceptos" for="idConcepto" />                             
                                <h:selectOneMenu binding="#{GastoPropiedadUI_Backing.idConcepto}" id="idConcepto" tabindex="6" >
                                    <f:selectItems value="#{GastoPropiedadUI_Backing.conceptosPorCondominio}"/>
                                </h:selectOneMenu>

                                <h:outputLabel value="Monto " for="mtoGastoPropiedad"/>                
                                <h:inputText required="false" id="mtoGastoPropiedad" size="24" 
                                             value="#{GastoPropiedadUI_Backing.mtoGastoPropiedad}" tabindex="7" />

                                <h:outputLabel value="Observaciones " for="obsGastoPropiedad"/>                
                                <h:inputText required="false" id="obsGastoPropiedad" size="24" 
                                             value="#{GastoPropiedadUI_Backing.obsGastoPropiedad}" tabindex="8" />

                            </h:panelGrid>
                        </td>  
                    </tr>  
                </table>

                <div align="center"><p>
                        <h:commandButton value="Agregar" action="#{GastoPropiedadUI_Backing.registrarGastoPropiedad}" 
                                         disabled ="#{BeanUsuario.agregar}"/>  

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Modificar" action="#{GastoPropiedadUI_Backing.modificarGastoPropiedad}"
                                         disabled ="#{BeanUsuario.modificar}"/>   

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Eliminar" action="eliminar"
                                         disabled ="#{BeanUsuario.eliminar}"/>   
                    </p></div>

                <hr width="100%"></hr>
                <h4><i>Gastos por propiedad registrados.</i><font size="2"><i> Seleccione el gasto a modificar/eliminar</i></font></h4>

                <t:dataTable id="TablaGastosPropiedad" rows="5" border="0"
                             value="#{GastoPropiedadUI_Backing.gastosPropiedadPorCondominio}"
                             var="co" rowClasses="list-row-odd,list-row-even" 
                             headerClass="table-header" 
                             width="100%" binding="#{GastoPropiedadUI_Backing.data}">

                    <t:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecGastoPropiedad}"/>
                    </t:column>

                    <t:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Documento Nro."/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.numDocGastoPropiedad}"/>
                    </t:column>

                    <t:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Proveedor"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombProveedor}"/>
                    </t:column>

                    <t:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Concepto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombConcepto}"/>
                    </t:column>

                    <t:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Monto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.mtoGastoPropiedad}"/>
                    </t:column>

                    <t:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Saldo"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.saldoGastoPropiedad}"/>
                    </t:column>

                    <t:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha Mov"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecMovGP}"/>
                    </t:column>

                    <t:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Estado"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.edoGastoPropiedad}"/>
                    </t:column>

                    <t:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Observaciones"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.obsGastoPropiedad}"/>
                    </t:column>

                    <t:column>
                        <h:commandLink action="#{GastoPropiedadUI_Backing.editarGastoPropiedadAction}">
                            <h:outputText value="Seleccionar" />
                        </h:commandLink>
                    </t:column>

                </t:dataTable>

                <!-- Custom Scroller Component -->

                <div align="center">
                    <t:dataScroller  id="scroller" for="TablaGastosPropiedad" 
                                     paginator="true">
                        <f:facet name="previous">
                            <t:panelGroup>
                                <t:graphicImage url="/images/arrow-left.gif"/>
                                <h:outputText value="Anterior" />
                            </t:panelGroup>
                        </f:facet>
                        <f:facet name="next">
                            <t:panelGroup>
                                <h:outputText value="Siguiente" />
                                <t:graphicImage url="/images/arrow-right.gif"/>
                            </t:panelGroup>
                        </f:facet>
                    </t:dataScroller></div>
            </h:form>
        </body>
    </f:view> 
</html>
