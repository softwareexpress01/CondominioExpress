<?xml version="1.0" encoding="ISO-8859-1"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core" 
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui">

    <f:view> 
        <h:head>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />

            </f:facet>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>
        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%"><i>
                                <h:commandLink immediate="true" onclick="Ayuda('ACategoriaUI.xhtml')">
                                    <h:outputText value="Ayuda"/>
                                </h:commandLink></i>
                        </td>
                    </tr>
                </table>

                <div><h4><i>Crear y Actualizar Categorías</i></h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>    

                <table width="65%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="2" border="0">

                                <h:outputLabel value="Nombre de la categoría " for="nombCategoria"/>                
                                <h:inputText required="false" id="nombCategoria" size="24" maxlength="30"
                                             value="#{CategoriaUI_Backing.nombCategoria}" tabindex="1" />
                            </h:panelGrid>
                        </td>  

                        <td>
                            <h:panelGrid width="100%" columns="2" border="0">

                                <h:outputLabel value="Descripción" for="descCategoria" />              
                                <h:inputText required="false" id="descCategoria" maxlength="60"
                                             value="#{CategoriaUI_Backing.descCategoria}" tabindex="2"/>
                            </h:panelGrid>
                        </td>     
                    </tr>  
                </table>

                <div align="center"><p>
                        <h:commandButton value="Agregar" action="#{CategoriaUI_Backing.registrarCategoria}" 
                                         disabled ="#{BeanUsuario.agregar}" tabindex="3"/>  

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Modificar" action="#{CategoriaUI_Backing.modificarCategoria}"
                                         disabled ="#{BeanUsuario.modificar}" tabindex="4"/>   

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Eliminar" action="eliminar"
                                         disabled ="#{BeanUsuario.eliminar}" tabindex="5"/>   
                    </p></div>

                <hr width="100%"></hr>
                <h4><i>Categorías registradas.</i><font size="2"><i> Seleccione la categoría a modificar/eliminar</i></font></h4>

                <p:dataTable id="TablaCategorias" rows="5" rowKey="#{co.id}"   selectionMode="single"  
                             value="#{CategoriaUI_Backing.categoriasPorCondominio}" paginatorPosition="bottom"
                             var="co" paginator="true"     
                             selection="#{CategoriaUI_Backing.filaSeleccionada}" >          

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Nombre"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombCategoria}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Descripción"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.descCategoria}"/>
                    </p:column>

                    <p:column>
                        <h:commandLink action="#{CategoriaUI_Backing.editarCategoriaAction}">
                            <h:outputText value="Seleccionar" />
                            <f:setPropertyActionListener value="#{co}" target="#{CategoriaUI_Backing.filaSeleccionada}" ></f:setPropertyActionListener>
                        </h:commandLink>
                    </p:column>

                </p:dataTable>

            </h:form>
        </body>
    </f:view> 
</html>
