<?xml version="1.0" encoding="ISO-8859-1"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core" 
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui">

    <f:view> 
        <h:head>
            <link href="../css/CalendarControl.css" rel="stylesheet" type="text/css"></link>
            <script src="../css/CalendarControl.js" language="javascript"></script>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />

            </f:facet>

            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin", "left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>    
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>

        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%"><i>
                                <h:commandLink onclick="Ayuda('AAjustesCondUI.xhtml')">
                                    <h:outputText value="Ayuda"/>
                                </h:commandLink></i>
                        </td>
                    </tr>
                </table>

                <div><h4><i>Registrar ajustes a gastos procesados</i></h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>    

                <table width="55%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="6" border="0">

                                <h:outputLabel value="Tipo " for="tipoAjustesCond"/>  
                                <h:selectOneMenu id="tipoAjustesCond" value="#{AjustesCondUI_Backing.tipoAjustesCond}" tabindex="2">
                                    <f:selectItem  itemLabel="Seleccione" itemValue="Seleccione" />
                                    <f:selectItem  itemLabel="Credito" itemValue="Credito" />
                                    <f:selectItem  itemLabel="Debito" itemValue="Debito" />
                                </h:selectOneMenu>

                                <h:outputLabel value="Período " for="perAjustesCond"/>                
                                <h:inputText required="false" id="perAjustesCond" size="10" maxlength ="10"
                                             value="#{AjustesCondUI_Backing.perAjustesCond}" tabindex="5" />


                            </h:panelGrid>
                        </td>
                        <td>
                            <h:panelGrid width="100%" columns="6" border="0">

                                <h:outputLabel value="Conceptos" for="idConcepto" />                             
                                <h:selectOneMenu value="#{AjustesCondUI_Backing.idConcepto}" id="idConcepto" tabindex="3" >
                                    <f:selectItems value="#{AjustesCondUI_Backing.conceptosPorCondominio}"/>
                                </h:selectOneMenu>
                            </h:panelGrid>
                        </td> 

                    </tr>  
                    <tr>
                        <td >
                            <h:panelGrid  width="100%" columns="6" border="0">

                                <h:outputLabel value="Descripción" for="desc" />                             
                                <h:inputText required="false" id="descAjustesCond" size="25" maxlength ="30"
                                             value="#{AjustesCondUI_Backing.descAjustesCond}" tabindex="4" />
                            </h:panelGrid>
                        </td>
                        <td >
                            <h:panelGrid  width="100%" columns="6" border="0" >
                                <h:outputLabel value="Monto" for="mtoAjustesCond"/>
                                
                                <h:inputText required="false" id="mtoAjustesCond" size="12" maxlength ="12"
                                             value="#{AjustesCondUI_Backing.mtoAjustesCond}" tabindex="5" />

                            </h:panelGrid>
                        </td>  

                    </tr> 
                </table>
                <br></br>
                <div align="center"><p>
                        <h:commandButton value="Agregar" action="#{AjustesCondUI_Backing.registrarAjustesCond}" tabindex="5"
                                         disabled ="#{BeanUsuario.agregar}"/>  

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Modificar" action="#{AjustesCondUI_Backing.modificarAjustesCond}" tabindex="6"
                                         disabled ="#{BeanUsuario.modificar}"/>   

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Eliminar" action="eliminar" tabindex="7"
                                         disabled ="#{BeanUsuario.eliminar}"/>   
                    </p></div>

                <hr width="100%"></hr>
                <h4><i>Ajustes registrados.</i><font size="2"><i> Seleccione el Ajuste a modificar/eliminar</i></font></h4>

                <p:dataTable id="TablaAjustesCond" rows="5" rowKey="#{co.id}"   
                             value="#{AjustesCondUI_Backing.ajustesCondPorCond}" paginatorPosition="bottom"
                             var="co" paginator="true"   emptyMessage=" " selectionMode="single">  

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha Mov"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecMovAjustesCond}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Tipo"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.tipoAjustesCond}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Concepto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombConcepto}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Descripción"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.descAjustesCond}"/>
                    </p:column>

                    <p:column style="text-align:right">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Monto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.mtoAjustesCondString}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Periodo"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.perAjustesCond}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Estado"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.edoAjustesCond}"/>
                    </p:column>

                    <p:column>
                        <h:commandLink action="#{AjustesCondUI_Backing.editarAjustesCondAction}">
                            <h:outputText value="Seleccionar" />
                            <f:setPropertyActionListener value="#{co}" target="#{AjustesCondUI_Backing.filaSeleccionada}" ></f:setPropertyActionListener>
                        </h:commandLink>
                    </p:column>

                </p:dataTable>

            </h:form>
        </body>
    </f:view> 
</html>
