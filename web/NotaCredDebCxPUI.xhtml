<?xml version='1.0' encoding='ISO-8859-1' ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core" 
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui">

    <f:view> 
        <h:head>
            <link href="../css/CalendarControl.css" rel="stylesheet" type="text/css"></link>
            <script src="../css/CalendarControl.js" language="javascript"></script>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />

            </f:facet>

            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>

        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%"><i>
                                <h:commandLink onclick="Ayuda('ANotaCredDebCxPUI.xhtml')">
                                    <h:outputText value="Ayuda"/>
                                </h:commandLink></i>
                        </td>
                    </tr>
                </table>

                <div><h4><i>Registrar Notas de Credito de CxP</i></h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>    
                <hr size="2" width="60%"></hr>
                <table width="60%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="4" border="0">

                                <h:outputLabel value="Proveedor " for="idProveedor"/>   
                                <h:selectOneMenu value="#{NotaCredDebCxPUI_Backing.idProveedor}" id="idProveedor" tabindex="1" 
                                                 valueChangeListener="#{NotaCredDebCxPUI_Backing.inicializarPanel}" 
                                                 onchange="this.form.submit()">  
                                    <f:selectItems value="#{NotaCredDebCxPUI_Backing.proveedoresPorCondominio}" />
                                </h:selectOneMenu>

                                <h:outputLabel value="Fecha nota (dd-mm-aaaa) " for="fecNotaCredDebCxP"/>  
                                <h:inputText required="false" id="fecNotaCredDebCxP" size="24" maxlength ="10"
                                             binding="#{NotaCredDebCxPUI_Backing.fecNotaCredDebCxP}" tabindex="2"
                                             onfocus="showCalendarControl(this);"/>

                                <h:outputLabel value="Conceptos" for="idConcepto" />                             
                                <h:selectOneMenu binding="#{NotaCredDebCxPUI_Backing.idConcepto}" id="idConcepto" tabindex="4" >
                                    <f:selectItems value="#{NotaCredDebCxPUI_Backing.conceptosPorCondominio}"/>
                                </h:selectOneMenu>

                                <h:outputLabel value="Monto " for="mtoNotaCredDebCxP"/>                
                                <h:inputText required="false" id="mtoNotaCredDebCxP" size="24" maxlength ="12"
                                             binding="#{NotaCredDebCxPUI_Backing.mtoNotaCredDebCxP}" tabindex="5" />



                            </h:panelGrid>
                        </td>  
                    </tr>  
                </table>
                <hr size="2" width="60%"></hr>
                <br></br>
                <div align="center"><p>
                        <h:commandButton value="Agregar" action="#{NotaCredDebCxPUI_Backing.registrarNotaCredDebCxP}" tabindex="6"
                                         disabled ="#{BeanUsuario.agregar}"/>  

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Modificar" action="#{NotaCredDebCxPUI_Backing.modificarNotaCredDebCxP}" tabindex="7"
                                         disabled ="#{BeanUsuario.modificar}"/>   

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Eliminar" action="eliminar" tabindex="8"
                                         disabled ="#{BeanUsuario.eliminar}"/>   
                    </p></div>

                <hr width="100%"></hr>
                <h4><i>Notas de crédito/débito registradas.</i><font size="2"><i> Seleccione la nota a modificar/eliminar</i></font></h4>

                <p:dataTable id="TablaNotasCredDebCxP" rows="5" rowKey="#{co.id}"   
                             value="#{NotaCredDebCxPUI_Backing.notasCredDebCxPPorProveedor}" paginatorPosition="bottom"
                             var="co" paginator="true"   emptyMessage=" " selectionMode="single">  


                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Nota Crédito"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.numNotaCredDebCxP}" style="font-size: small" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecNotaCredDebCxP}" style="font-size: small" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Concepto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombConcepto}" style="font-size: small" />
                    </p:column>

                    <p:column style="text-align:right">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Monto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.mtoNotaCredDebCxPString}" style="font-size: small" />
                    </p:column>

                    <p:column style="text-align:right">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Saldo"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.saldoNotaCredDebCxPString}" style="font-size: small" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha Mov"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecMovNCD}" style="font-size: small" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Tipo"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.tipoNotaCredDebCxP}" style="font-size: small" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Estado"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.edoNotaCredDebCxP}" style="font-size: small" />
                    </p:column>

                    <p:column>
                        <h:commandLink action="#{NotaCredDebCxPUI_Backing.editarNotasCredDebCxPAction}">
                            <h:outputText value="Seleccionar" />
                            <f:setPropertyActionListener value="#{co}" target="#{NotaCredDebCxPUI_Backing.filaSeleccionada}" ></f:setPropertyActionListener>
                        </h:commandLink>
                    </p:column>

                </p:dataTable>

            </h:form>
        </body>
    </f:view> 
</html>
