<?xml version='1.0' encoding="ISO-8859-1" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core">

    <f:view> 
        <h:head>

            <link href="../css/CalendarControl.css" rel="stylesheet" type="text/css"></link>
            <script src="../css/CalendarControl.js" language="javascript"></script>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>

            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin", "left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
        </h:head>
        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="400" />
                            </h1></div>
                    </tr>          
                </table>   
                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/></i></font>
                            </td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i>Condominio:<f:verbatim>&nbsp;</f:verbatim><h:outputLabel  value="#{BeanUsuario.condominioActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%">
                            <i><h:commandLink action="#{ConExpAvisoDeCobroUI_Backing.salir}" immediate="true"> <h:outputText value="Salir"/></h:commandLink></i>
                        </td>
                    </tr>
                </table>

                <br />

                <br></br>
                <div align="center">
                    <h:outputText value="Consulta Express" style="  font-weight:500; font-family: arial;font-size: x-large; color: green; font-style: italic"></h:outputText>
                </div>
                <br></br>
                <div align="center" ><h4>Generar Avisos de Cobro</h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>   

                <hr size="1" width="40%"></hr>
                <br></br>

                <table width="70%" border="0" align="center">
                    <tr align="center">
                        <td align="center">
                            <h:outputLabel value="Periodo requerido(mm-aaaa) " for="periodo"/>  
                            <h:inputText required="false" id="periodo" size="10"
                                         onchange="this.form.submit()"
                                         value="#{ConExpAvisoDeCobroUI_Backing.periodo}" tabindex="1"/>
                        </td>
                    </tr>  
                </table>
                <br></br>

                <table width="25%" border="0" align="center">
                    <tr>
                        <td align = "center" ><h:outputLabel value="¿Mostrar Total en dólares?" for="seleccionDolares" /></td>
                       
                            <td align = "center">
                                <h:panelGrid width="100%" columns="6" border="0">

                                    <h:selectOneMenu id="seleccionDolares" value="#{ConExpAvisoDeCobroUI_Backing.seleccionDolares}" tabindex="3">
                                        <f:selectItem  itemLabel="No" itemValue="No"/>
                                        <f:selectItem  itemLabel="Si" itemValue="Si" />
                                    </h:selectOneMenu>

                                </h:panelGrid>
                            </td>
                       
                    </tr> 
                </table>

                <hr size="1" width="40%"></hr>
                <br></br>
                <div align="center">
                    <p>
                        <h:commandButton value="Generar Avisos de Cobro" actionListener="#{ConExpAvisoDeCobroUI_Backing.generarAvisosDeCobro}" tabindex="2"/> 

                    </p>
                </div>  
            </h:form>
        </body>
    </f:view> 
</html>
