<?xml version='1.0' encoding="ISO-8859-1" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui" >
    <h:head>
        <title>Software Express Condominio</title>
        <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
        <f:facet name="first"> 
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
        </f:facet>
        <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
    </h:head>
    <h:body>
        <h:form>
          
            <table width="100%" border="0">
                        <tr>
                            <div align="center">
                                    <h:graphicImage url="/images/LogoPagina.png" height="65" width="400" />
                                </div>
                        </tr>          
                    </table> 
                    <hr size="1" width="100%"></hr>
            <br />
            <div align="center"><h:outputText value="Condominio Express" 
                                              style="  font-weight: bold; font-family: arial;font-size: large; color:green; font-style: italic">
                </h:outputText></div>
            <div align="center"><h:outputText value="Pagos de mensualidades" 
                                              style="  font-weight: bold; font-family: arial;font-size: large; color:green; font-style: italic">
                </h:outputText></div>

            <br />
            <h:messages globalOnly="true" infoClass="RegError"/>  

            <hr size="1" width="35%"></hr>
            <br />

            <div align="center">

                <h:panelGrid columns="2" cellpadding="2" style="background-color: #DDD">  

                    <h:outputText value="Nro. suscripción" 
                                  style="font-family: arial;font-size: small; color:blue; font-style: italic">      
                    </h:outputText>

                    <p:inputText id="tab00Text" size="15" value="#{PagoMensualidadUI_Backing.numSuscripcion}" tabindex="1"/> 
                    <h:outputText value="Contraseña" 
                                  style="font-family: arial;font-size: small; color:blue; font-style: italic">      
                    </h:outputText>

                    <p:password id="tab01Text" size="15" value="#{PagoMensualidadUI_Backing.contraseñaSuscripcion}" tabindex="2" />          
                </h:panelGrid> 
                <br /><br />
                <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>
                <h:commandButton id="tab02Text" value="Registrar pagos" action="#{PagoMensualidadUI_Backing.registrarPagoMensual}" tabindex="3"
                                 style="font-family: arial;font-size: small; color:black; font-style: italic"/>
            </div>
            <br />
            <hr size="1" width="35%"></hr>
        </h:form>
    </h:body>
</html>
