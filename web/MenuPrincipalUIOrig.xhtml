<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core">
    <h:head>
        <title>Software Express condominio</title> 
        <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
        <f:facet name="first"> 
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
        </f:facet>
    </h:head>
    <h:body>
        <h:form>
            <table  width="100%" border="0" >
                <tr>
                    <div align="center"><h1>
                            <h:graphicImage url="/logo2.jpg" height="60" width="400" />
                        </h1></div>
                </tr>
            </table>
            <table width="100%" class="BarBkgnd">
                <tr>
                    <td align="left">
                        <td>
                            <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                </i></font></td>
                    </td>
                    <td></td><td></td><td></td>
                    <td align="center" width="10%" >
                        <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                    </td>
                    <td align="right" width="25%"><i>
                            <h:commandLink action="selcond" immediate="true">
                                <h:outputText value="Ir a Seleccionar Condominio"/>
                            </h:commandLink>
                            <f:verbatim>&nbsp;&nbsp;|&nbsp;&nbsp;</f:verbatim>
                            <h:commandLink action="bienvenida" immediate="true">
                                <h:outputText value="Salir"/>
                            </h:commandLink>
                            <f:verbatim>&nbsp;&nbsp;|&nbsp;&nbsp;</f:verbatim>
                            <h:commandLink immediate="true">
                                <h:outputText value="Ayuda"/>
                            </h:commandLink></i>
                    </td>
                </tr>
            </table>

            <table  width="11%" border="0" class="BarBkgnd" cellpadding="4">

                <hr size="2" width="100%"></hr>
                <!--<h4><i>Menu Principal</i></h4> -->
                <tr></tr><tr></tr>
                <tr>

                    <td>
                        <h:commandLink action="datosbasicos" disabled="#{BeanUsuario.datosBasicos}">
                            <font color="#0066cc" size="2"><h:outputText value="Datos Basicos"></h:outputText></font> 
                        </h:commandLink>
                    </td>
                </tr>
                <tr></tr><tr></tr>
                <tr>
                    <td>
                        <h:commandLink action="movimientos" disabled ="#{BeanUsuario.movMes}">
                            <font color="#0066cc" size="2" ><h:outputText value="Movimientos del mes"></h:outputText></font>
                        </h:commandLink>
                    </td>
                </tr>
                <tr></tr><tr></tr>
                <tr>
                    <td>
                        <h:commandLink action="informes" disabled ="#{BeanUsuario.informes}">
                            <font color="#0066cc" size="2"><h:outputText value="Informes"></h:outputText></font>
                        </h:commandLink>
                    </td>
                </tr>
                <tr></tr><tr></tr>
                <tr>
                    <td>
                        <h:commandLink action="Gestion" disabled ="#{BeanUsuario.gestion}">
                            <font color="#0066cc" size="2"><h:outputText value="Gestion"></h:outputText></font>
                        </h:commandLink>
                    </td>
                </tr>
                <tr></tr><tr></tr>
                <tr>
                    <td>
                        <h:commandLink action="configuracion" disabled="#{BeanUsuario.configuracion}">
                            <font color="#0066cc" size="2"><h:outputText value="Configuracion"></h:outputText></font>
                        </h:commandLink>
                    </td>
                </tr>
                <tr></tr><tr></tr>
                <tr>
                    <td>
                        <h:commandLink action="administracion" disabled ="#{BeanUsuario.admin}">
                            <font color="#0066cc" size="2"><h:outputText value="Administracion"></h:outputText></font>
                        </h:commandLink>
                    </td>
                </tr>
                <tr></tr><tr></tr>
            </table>
            <h:messages globalOnly="true" infoClass="RegError"/>   
        </h:form>
    </h:body>
</html>
