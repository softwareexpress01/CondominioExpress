<?xml version="1.0" encoding="ISO-8859-1"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core" 
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui">

    <f:view> 
        <h:head>
            <link href="../css/CalendarControl.css" rel="stylesheet" type="text/css"></link>
            <script src="CalendarControl.js" language="javascript"></script>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link >
            <script type="text/javascript">
                function limita(maximoCaracteres) {
                    var elemento = document.getElementById("obsGastoNoComun");
                    if(elemento.value.length >= maximoCaracteres ) {
                        return false;
                    }
                    else {
                        return true;
                    }
                }
            </script>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>
        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%"><i>
                                <h:commandLink immediate="true"  onclick="Ayuda('AGastoNoComunUI.xhtml')">
                                    <h:outputText value="Ayuda"/>
                                </h:commandLink></i>
                        </td>
                    </tr>
                </table>

                <div><h4><i>Procesar gastos no comunes</i></h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/> 
                <h:message for="opcion" errorClass="ValidateError"/>
                <hr size="2" width="80%"></hr>
                <table width="80%" border="0" align ="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="4" border="0"  >

                                <h:outputLabel value="Inmueble(s) a asociar(les) el gasto:" for="opcion" />   
                                <h:selectOneRadio id="opcion"  binding="#{GastoNoComunUI_Backing.seleccion}"        
                                                  valueChangeListener="#{GastoNoComunUI_Backing.mostrarLista}"
                                                  disabled ="#{BeanUsuario.deshabRadio}"
                                                  onchange="this.form.submit();" immediate="true">
                                    <f:selectItem itemLabel="Todos" itemValue="todos"/>
                                    <f:selectItem itemLabel="Varios" itemValue="varios"/>
                                </h:selectOneRadio>

                                <h:selectManyListbox value="#{GastoNoComunUI_Backing.idInmueble}" id="idInmueble" tabindex="3" size="4"
                                                     rendered ="#{BeanUsuario.mostrar}" immediate="true">
                                    <f:selectItems value="#{GastoNoComunUI_Backing.listaInmuebles}"/>
                                </h:selectManyListbox>
                                <p:tooltip for="idInmueble" value="Para seleccion multiple: ctrl+click" showEffect="highlight" hideEffect="fade" />  
                            </h:panelGrid>
                        </td> 
                    </tr>
                </table>   
                <hr size="2" width="80%"></hr>
                <table width="80%" border="0" align="center">

                    <tr>     
                        <td>
                            <h:panelGrid width="100%" columns="6" border="0">

                                <h:outputLabel value="Proveedor" for="idProveedor" />                             
                                <h:selectOneMenu value="#{GastoNoComunUI_Backing.idProveedor}" id="idProveedor" tabindex="4" >
                                    <f:selectItems value="#{GastoNoComunUI_Backing.proveedoresPorCondominio}"/>
                                </h:selectOneMenu>

                                <h:outputLabel value="Nro. documento " for="numDocGastoNoComun"/>                
                                <h:inputText required="false" id="numDocGastoNoComun" size="15" maxlength="20"
                                             value="#{GastoNoComunUI_Backing.numDocGastoNoComun}" tabindex="5" /> 

                                <h:outputLabel value="Fecha doc (dd-mm-aaaa) " for="fecGastoNoComun"/>   
                                <h:inputText required="false" id="fecGastoNoComun" size="15" 
                                             value="#{GastoNoComunUI_Backing.fecGastoNoComun}" tabindex="6" 
                                             onfocus="showCalendarControl(this);"/> 

                                <h:outputLabel value="Concepto" for="idConcepto" />                             
                                <h:selectOneMenu value="#{GastoNoComunUI_Backing.idConcepto}" id="idConcepto" tabindex="7" >
                                    <f:selectItems value="#{GastoNoComunUI_Backing.conceptosPorCondominio}"/>
                                </h:selectOneMenu>

                                <h:outputLabel value="Periodo (mm-aaaa)" for="perGastoNoComun" />                             
                                <h:inputText required="false" id="perGastoNoComun" size="15" maxlength="10" 
                                             value="#{GastoNoComunUI_Backing.perGastoNoComun}" tabindex="8" />

                                <h:outputLabel value="Monto " for="mtoGastoNoComun"/>                
                                <h:inputText required="false" id="mtoGastoNoComun" size="15" maxlength="12"
                                             disabled ="#{BeanUsuario.deshabilitar}"
                                             value="#{GastoNoComunUI_Backing.mtoGastoNoComun}" tabindex="9" />                               
                            </h:panelGrid>
                        </td>  
                    </tr>  
                </table>
                <hr size="2" width="80%"></hr>
                <table width="40%"  border="0" align="center">
                    <tr>
                        <td>
                            <h:outputLabel value="Observaciones " for="obsGastoNoComun"/>                
                            <t:inputTextarea required="false" id="obsGastoNoComun" cols="40" rows="1" 
                                             value="#{GastoNoComunUI_Backing.obsGastoNoComun}" tabindex="10" 
                                             onkeypress="return limita(60);" forceId="true"/>
                            <p:tooltip for="obsGastoNoComun" value="Opcional" showEffect="highlight" hideEffect="fade" />  
                        </td>
                    </tr>
                </table>
                <hr size="2" width="80%"></hr>
                <br></br>
                <div align="center"><p>
                        <h:commandButton value="Agregar" action="#{GastoNoComunUI_Backing.registrarGastoNoComun}" 
                                         disabled ="#{BeanUsuario.agregar}" tabindex="11" />  

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Modificar" action="#{GastoNoComunUI_Backing.modificarGastoNoComun}"
                                         disabled ="#{BeanUsuario.modificar}" tabindex="12" />   

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Eliminar" action="eliminar"
                                         disabled ="#{BeanUsuario.eliminar}" tabindex="13" />   
                    </p></div>

                <hr width="100%"></hr>
                <h4><i>Gastos no comunes registrados.</i><font size="2"><i> Seleccione el gasto a modificar/eliminar</i></font></h4>

                <p:dataTable id="TablaGastosNoComunes" rows="5" rowKey="#{co.id}"   
                             value="#{GastoNoComunUI_Backing.gastosNoComunesPorCondominio}" paginatorPosition="bottom"
                             var="co" paginator="true"   
                             selection="#{GastoNoComunUI_Backing.filaSeleccionada}" selectionMode="single">  

                    <p:column width="80">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecGastoNoComun}" style="font-size: small" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Numero doc"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.numDocGastoNoComun}" style="font-size: small" />
                    </p:column>

                    <p:column  width="80">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Concepto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombConcepto}" style="font-size: small" />
                    </p:column>

                    <p:column width="80">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Proveedor"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombProveedor}" style="font-size: small" />
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Periodo"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.perGastoNoComun}" style="font-size: small" />
                    </p:column>

                    <p:column style="text-align:right">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Monto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.mtoGastoNoComunString}" style="font-size: small" />
                    </p:column>

                    <p:column style="text-align:right">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Saldo"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.saldoGastoNoComunString}" style="font-size: small" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha Mov"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecMovGNC}" style="font-size: small" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Estado"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.edoGastoNoComun}" style="font-size: small" />
                    </p:column>

                    <p:column style="width:15%">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Observaciones"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.obsGastoNoComun}" style="font-size: small" />
                    </p:column>

                    <p:column>
                        <h:commandLink action="#{GastoNoComunUI_Backing.editarGastosNoComunesAction}">
                            <h:outputText value="Seleccionar" />
                            <f:setPropertyActionListener value="#{co}" target="#{GastoNoComunUI_Backing.filaSeleccionada}" ></f:setPropertyActionListener>
                        </h:commandLink>
                    </p:column>
                </p:dataTable>

            </h:form>
        </body>
    </f:view> 
</html>
