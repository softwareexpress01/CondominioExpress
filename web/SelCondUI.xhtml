<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core">

    <f:view> 
        <h:head>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>

        <body><h:form>

                <table width="100%" border="0" >
                    <tr>
                        <tr>
                            <div align="center"><h1>
                                    <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                                </h1></div>
                        </tr>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="right">
                            <h:commandLink action="#{SelCondUI_Backing.salir}" immediate="true">
                                <h:outputText value="Salir"/>
                            </h:commandLink>
                            <f:verbatim>&nbsp;&nbsp;|&nbsp;&nbsp;</f:verbatim>
                            <h:commandLink immediate="true" onclick="Ayuda('ASelCondUI.xhtml')" >
                                <h:outputText value="Ayuda"/>
                            </h:commandLink>
                        </td>
                    </tr>
                </table>

                <div align="center"><h4>Seleccionar Condominio</h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>   
                <h:message for="nombCondominio" errorClass="ValidateError"/>
                <h:message for="nombPropiedad" errorClass="ValidateError"/>

                <hr size="1" width="45%"></hr>
                <br></br>

                <table width="42%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="4" border="0">

                                <h:outputLabel value="Condominios" id="Cond" />                             
                                <h:selectOneMenu binding="#{SelCondUI_Backing.nombCondominio}" id="nombCondominio">
                                    <f:ajax event="valueChange" render="nombPropiedad"  listener="#{SelCondUI_Backing.propiedadesCondominio}"/>
                                    <f:selectItems value="#{SelCondUI_Backing.condominiosPorUsuario}"/>
                                </h:selectOneMenu>

                                <h:outputLabel value="Propiedades" id="Prop" />                
                                <h:selectOneMenu id="nombPropiedad" 
                                                 binding="#{SelCondUI_Backing.nombPropiedad}" >
                                    <f:ajax event="valueChange" listener="#{SelCondUI_Backing.aceptarPropiedad}"/>
                                    <f:selectItems value="#{SelCondUI_Backing.listaPropiedades}" />

                                </h:selectOneMenu>

                            </h:panelGrid>
                        </td>
                    </tr>
                </table>
                <br></br>
                <hr size="1" width="45%"></hr>
                <br></br>
                <table  width="20%" border="0" align="center">
                    <tr>
                        <td width="10%">
                            <h:commandButton value="Crear condominio" action="#{SelCondUI_Backing.irACrearCondominio}" 
                                             disabled ="#{BeanUsuario.irACrearCondominio}"/>
                        </td>
                        <td width="10%" align="center">
                            <h:commandButton value="Aceptar" action="#{SelCondUI_Backing.aceptar}" immediate="true"
                                             disabled ="#{BeanUsuario.agregar}" />
                        </td>
                    </tr>
                </table>
            </h:form>
        </body>
    </f:view> 
</html>
