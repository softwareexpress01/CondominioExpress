<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core" xmlns:t="http://myfaces.apache.org/tomahawk">

    <f:view> 
        <h:head>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>
        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%"><i>
                                <h:commandLink action="#{ElimFondoUI_Backing.regresar}" immediate="true">
                                    <h:outputText value="Salir"/>
                                </h:commandLink>
                                <f:verbatim>&nbsp;&nbsp;|&nbsp;&nbsp;</f:verbatim>
                                <h:commandLink immediate="true">
                                    <h:outputText value="Ayuda"/>
                                </h:commandLink></i>
                        </td>
                    </tr>
                </table>

                <div align="center"><h4><i>Eliminar Fondos</i></h4></div>
                <h:messages globalOnly="true" infoClass="RegError"/>   
                <hr size="1" width="50%"></hr>
                <table align="center" width="50%">
                    <br></br>
                    <tr>
                        <td><i><b><font color="#cc0033">Advertencia!:</font></b></i> Esta acción eliminará<f:verbatim>&nbsp;&nbsp;</f:verbatim><i><b>toda</b></i> <f:verbatim>&nbsp;&nbsp;</f:verbatim>la información
                            que ha sido registrada hasta ahora para el Fondo <font color="#0066cc"><i><h:outputLabel value="#{BeanUsuario.nombEntidadElim}"/></i></font>. Toda la información
                            asociada con este será borrada de la base de datos. 
                            <h3 align="center"><i><font color="#0066cc">Desea Continuar?</font></i></h3>
                        </td>
                    </tr>
                </table>

                <div align="center"><p>
                        <h:commandButton value="Si" action="#{ElimFondoUI_Backing.eliminarFondo}" 
                                         disabled ="#{BeanUsuario.si}"/>  

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="No" action="#{ElimFondoUI_Backing.regresar}"
                                         disabled ="#{BeanUsuario.no}"/>   
                    </p></div>
                <hr size="1" width="50%"></hr>
            </h:form>
        </body>
    </f:view> 
</html>
