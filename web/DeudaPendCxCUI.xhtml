<?xml version="1.0" encoding="ISO-8859-1"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://java.sun.com/jsf/html" 
      xmlns:f="http://java.sun.com/jsf/core" 
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui">

    <f:view> 
        <h:head>
            <link href="../css/CalendarControl.css" rel="stylesheet" type="text/css"></link>
            <script src="CalendarControl.js" language="javascript"></script>
            <title>Software Express Condominio</title>
            <link href="../css/condominio.css" rel="stylesheet" media="screen"></link>
            <script language="javascript">
                function Ayuda(tema)
                {
                    var AWin;
                    AWin = window.open(tema, "helpwin","left=750,height=450,width=600, resizable=yes");
                    AWin.focus();
                }
            </script>
            <f:facet name="first"> 
                <meta http-equiv="X-UA-Compatible" content="IE=edge" />
                <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
            </f:facet>
            <link rel="shortcut icon" href="../Bolatransparente.png" height="64" width="64" />
        </h:head>
        <body>
            <h:form>
                <table width="100%" border="0">
                    <tr>
                        <div align="center"><h1>
                                <h:graphicImage url="/condominioexpress.png" height="65" width="380" />
                            </h1></div>
                    </tr>          
                </table>      

                <table width="100%" class="BarBkgnd">
                    <tr>
                        <td align="left">
                            <td>
                                <font color="#0066cc"><i>Bienvenido(a),<f:verbatim>&nbsp;&nbsp;</f:verbatim><h:outputLabel value="#{BeanUsuario.nombUsuario}"/>
                                    </i></font></td>
                        </td>
                        <td></td><td></td><td></td>
                        <td align="center" width="10%" >
                            <td><font color="#0066cc"><i><h:outputLabel  value="#{BeanUsuario.condominioActual}"/>,<h:outputLabel value="#{BeanUsuario.propiedadActual}"/></i></font></td>
                        </td>
                        <td align="right" width="25%"><i>
                                <h:commandLink immediate="true" onclick="Ayuda('ADeudaPendUI.xhtml')">
                                    <h:outputText value="Ayuda"/>
                                </h:commandLink></i>
                        </td>
                    </tr>
                </table>

                <div><h4><i>Registrar deudas pendientes (CxC)</i></h4></div>

                <h:messages globalOnly="true" infoClass="RegError"/>    
                <hr size="2" width="60%"></hr>
                <table width="60%" border="0" align="center">
                    <tr>
                        <td>
                            <h:panelGrid width="100%" columns="4" border="0">

                                <h:outputLabel value="Inmueble " for="idInmueble"/>   
                                <h:selectOneMenu value="#{DeudaPendCxCUI_Backing.idInmueble}" id="idInmueble" tabindex="3" 
                                                 valueChangeListener="#{DeudaPendCxCUI_Backing.inicializarPanel}"
                                                 onchange="this.form.submit()">
                                    <f:selectItems value="#{DeudaPendCxCUI_Backing.inmueblesPorPropiedad}"/>
                                </h:selectOneMenu>

                                <h:outputLabel value="Fecha (dd-mm-aaaa) " for="fecDeudaPendCxC"/>                
                                <h:inputText required="false" id="fecDeudaPendCxC" size="14" 
                                             binding="#{DeudaPendCxCUI_Backing.fecDeudaPendCxC}" tabindex="4"
                                             onfocus="showCalendarControl(this);"/> 

                                <h:outputLabel value="Conceptos" for="idConcepto" />                             
                                <h:selectOneMenu binding="#{DeudaPendCxCUI_Backing.idConcepto}" id="idConcepto" tabindex="5" >
                                    <f:selectItems value="#{DeudaPendCxCUI_Backing.conceptosPorCondominio}"/>
                                </h:selectOneMenu>

                                <h:outputLabel value="Tipo Deuda" for="tipoDeudaPendCxC" />                             
                                <h:selectOneMenu binding="#{DeudaPendCxCUI_Backing.tipoDeudaPendCxC}" id="tipoDeudaPendCxC" tabindex="5" >
                                    <f:selectItem  itemLabel="Deuda ordinaria" itemValue="ORD" />
                                    <f:selectItem  itemLabel="Intereses de mora" itemValue="MORA" />
                                </h:selectOneMenu>

                                <h:outputLabel value="Monto " for="mtoDeudaPendCxC"/>                
                                <h:inputText required="false" id="mtoDeudaPendCxC" size="14" maxlength="12"
                                             binding="#{DeudaPendCxCUI_Backing.mtoDeudaPendCxC}" tabindex="6" />
                            </h:panelGrid>
                        </td>  
                    </tr>  
                </table>
                <hr size="2" width="60%"></hr> 
                <br></br>
                <div align="center"><p>
                        <h:commandButton value="Agregar" action="#{DeudaPendCxCUI_Backing.registrarDeudaPendCxC}" 
                                         disabled ="#{BeanUsuario.agregar}" tabindex="7"/>  

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Modificar" action="#{DeudaPendCxCUI_Backing.modificarDeudaPendCxC}"
                                         disabled ="#{BeanUsuario.modificar}"/>   

                        <f:verbatim>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</f:verbatim>

                        <h:commandButton value="Eliminar" action="eliminar"
                                         disabled ="#{BeanUsuario.eliminar}"/>   
                    </p></div>

                <hr width="100%"></hr>
                <h4><i>Deudas pendientes (CxC) registradas.</i><font size="2"><i> Seleccione la deuda a modificar/eliminar</i></font></h4>

                <p:dataTable id="TablaDeudasPendCxC" rows="5" rowKey="#{co.id}"   selectionMode="single"
                             value="#{DeudaPendCxCUI_Backing.deudasPendCxCPorInmueble}" paginatorPosition="bottom"
                             var="co" paginator="true" 
                             selection="#{DeudaPendCxCUI_Backing.filaSeleccionada}" >

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecDeudaPend}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Concepto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.nombConcepto}"/>
                    </p:column>

                    <p:column style="text-align:right">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Monto"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.mtoDeudaPendString}"/>
                    </p:column>

                    <p:column style="text-align:right">
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Saldo"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.saldoDeudaPendString}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Fecha Mov"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.fecMovDP}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Estado"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.edoDeudaPend}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:panelGroup>
                                <h:outputText value="Tipo"/>
                            </h:panelGroup>
                        </f:facet>                    
                        <h:outputText value="#{co.tipoDeudaPend}"/>
                    </p:column>

                    <p:column>
                        <h:commandLink action="#{DeudaPendCxCUI_Backing.editarDeudasPendCxCAction}">
                            <h:outputText value="Seleccionar" />
                            <f:setPropertyActionListener value="#{co}" target="#{DeudaPendCxCUI_Backing.filaSeleccionada}" ></f:setPropertyActionListener>
                        </h:commandLink>
                    </p:column>

                </p:dataTable>

            </h:form>
        </body>
    </f:view> 
</html>
